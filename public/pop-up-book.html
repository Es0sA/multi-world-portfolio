<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pop-Up Book | Selected Projects</title>
<meta name="theme-color" content="#2a1f4d">
<script>
/* Portal arrival: read the hub's query string before first paint. */
(function () {
  try {
    var q = new URLSearchParams(location.search);
    if (q.get('portal')) {
      var c = (q.get('c') || '180,140,255').split(',').map(Number);
      if (c.length !== 3 || c.some(isNaN)) c = [180, 140, 255];
      var x = parseFloat(q.get('x')), y = parseFloat(q.get('y'));
      if (isNaN(x)) x = 0.5;
      if (isNaN(y)) y = 0.5;
      var d = document.documentElement;
      d.classList.add('portal-in');
      d.style.setProperty('--pc', c.join(','));
      d.style.setProperty('--px', (x * 100) + '%');
      d.style.setProperty('--py', (y * 100) + '%');
      var qx = parseFloat(q.get('px')), qy = parseFloat(q.get('py'));
      if (isFinite(qx) && isFinite(qy)) {
        d.style.setProperty('--px', qx + 'px');
        d.style.setProperty('--py', qy + 'px');
      }
    }
  } catch (e) {}
})();
</script>
<style>
:root {
  --ink: #2b1d3a;
  --paper: #fffaf0;
  --cream: #f6eddc;
  --red: #e4572e;
  --gold: #f6c453;
  --pc: 180, 140, 255;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --hand: "Marker Felt", "Chalkboard SE", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --pw: min(92vw, 600px, calc(66vh * 1.3));
  --ph: calc(var(--pw) * 0.74);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #1d1536; color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
html.portal-in { background: rgb(var(--pc)); }
html.portal-in #world { clip-path: circle(0 at var(--px) var(--py)); }
body { background: transparent; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

#world { position: fixed; inset: 0; overflow: hidden; background: radial-gradient(ellipse at 50% 42%, #4b3a82 0%, #2a1f4d 55%, #1a1233 100%); }
#world::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0.5;
  background-image: radial-gradient(circle, rgba(255,255,255,0.10) 1.5px, transparent 2px);
  background-size: 22px 22px;
}

/* ---------- the book ---------- */
.stage { position: absolute; inset: 0; display: grid; place-items: center; perspective: 1400px; perspective-origin: 50% 38%; touch-action: none; cursor: grab; }
.stage.grabbing { cursor: grabbing; }
.book { position: relative; width: var(--pw); height: var(--ph); transform-style: preserve-3d; transition: transform 0.9s cubic-bezier(0.3, 0.9, 0.3, 1); will-change: transform; }
.book.drag { transition: transform 0.12s ease-out; }
.shadowpool { position: absolute; left: -6%; right: -6%; top: -4%; bottom: -8%; border-radius: 50%; background: radial-gradient(ellipse, rgba(10,6,24,0.55), rgba(10,6,24,0) 70%); transform: translateZ(-14px); pointer-events: none; }
.board { position: absolute; inset: -2.2% -2.2% -2.2% -2.2%; background: var(--red); border-radius: 10px; transform: translateZ(-3px); box-shadow: 0 0 0 2px #b8421f inset; }
.base {
  position: absolute; inset: 0; transform-style: preserve-3d; border-radius: 6px;
  background: var(--paper);
  background-image: linear-gradient(180deg, rgba(0,0,0,0.0), rgba(120,90,40,0.07)), repeating-linear-gradient(90deg, rgba(120,90,40,0.025) 0 2px, transparent 2px 5px);
  box-shadow: inset 0 0 0 calc(var(--pw) * 0.012) #f1e5c8;
}
.printed { position: absolute; left: 6%; right: 6%; bottom: 3%; height: 19%; transform: translateZ(0.2px); pointer-events: none; }
.printed .t { font: 700 calc(var(--pw) * 0.062) / 1.05 var(--hand); color: var(--ink); }
.printed .m { margin-top: calc(var(--pw) * 0.008); font: 600 calc(var(--pw) * 0.026) / 1.3 var(--sans); letter-spacing: 0.14em; text-transform: uppercase; color: #7a5f92; }
.printed .l { margin-top: calc(var(--pw) * 0.012); font: calc(var(--pw) * 0.03) / 1.35 var(--serif); font-style: italic; color: #4b3a5e; }
.pieces { position: absolute; inset: 0; transform-style: preserve-3d; }

/* paper cut-outs: each one is hinged on its bottom edge and folds up from the page */
.piece {
  position: absolute; transform-origin: 50% 100%; transform: rotateX(0deg);
  transition: transform 0.7s cubic-bezier(0.3, 1.7, 0.5, 1) var(--d, 0s);
  will-change: transform; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.piece svg { width: 100%; height: 100%; display: block; overflow: visible; filter: drop-shadow(0 calc(var(--pw) * 0.006) 0 rgba(30, 15, 50, 0.28)); pointer-events: none; }
.pieces:not(.up) .piece { transition: transform 0.35s ease-in 0s; }
.pieces.up .piece { transform: rotateX(-88deg); }
.pieces.up .piece.boing { animation: boing 0.6s ease-out; }
@keyframes boing { 0% { transform: rotateX(-88deg); } 30% { transform: rotateX(-66deg); } 62% { transform: rotateX(-96deg); } 100% { transform: rotateX(-88deg); } }
.shadow {
  position: absolute; transform-origin: 50% 0; transform: translateZ(0.4px) scaleY(0); pointer-events: none;
  background: radial-gradient(ellipse at 50% 0%, rgba(30, 15, 50, 0.42), rgba(30, 15, 50, 0) 72%);
  transition: transform 0.35s ease-in 0s;
}
.pieces.up .shadow { transform: translateZ(0.4px) scaleY(1); transition: transform 0.7s ease-out var(--d, 0s); }
.banner {
  display: grid; place-items: center; width: 100%; height: 100%; padding: 0 4%;
  background: linear-gradient(#fff6dc, #f3e2b4); border: calc(var(--pw) * 0.007) solid var(--ink); border-radius: 6px;
  font-family: var(--hand); font-weight: 700; color: var(--ink); white-space: nowrap; text-align: center;
  box-shadow: 0 calc(var(--pw) * 0.008) 0 rgba(30, 15, 50, 0.3);
}
.back {
  position: absolute; left: 0; top: calc(var(--ph) * -1); width: 100%; height: 100%;
  transform-origin: 50% 100%; transform-style: preserve-3d; transform: rotateX(-180deg);
  transition: transform 1.1s cubic-bezier(0.3, 1.25, 0.4, 1);
}
.back.fast { transition: transform 0.55s ease-in-out; }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 6px; overflow: hidden; }
.face.front { background: var(--paper); border: calc(var(--pw) * 0.012) solid #f1e5c8; }
.face.front svg { width: 100%; height: 100%; display: block; }
.face.rear { transform: rotateX(180deg); background: var(--red); border: calc(var(--pw) * 0.012) solid #b8421f; cursor: pointer; }
.cv { position: absolute; inset: 6%; border: calc(var(--pw) * 0.006) solid var(--gold); border-radius: 6px; display: grid; align-content: center; justify-items: center; gap: 2%; text-align: center; background: radial-gradient(circle at 50% 36%, rgba(255,255,255,0.12), rgba(255,255,255,0) 60%); }
.cv .ct { font: 700 calc(var(--pw) * 0.1) / 0.95 var(--hand); color: var(--paper); text-shadow: 0 calc(var(--pw) * 0.007) 0 #8f2f12; letter-spacing: 0.02em; }
.cv .cs { font: 600 calc(var(--pw) * 0.03) / 1 var(--sans); letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); }
.cv .cb { font: italic calc(var(--pw) * 0.034) / 1 var(--serif); color: #ffe3cf; }
.cv svg { width: calc(var(--pw) * 0.3); height: calc(var(--pw) * 0.2); }

/* ---------- interface ---------- */
.bar { position: absolute; left: 0; right: 0; top: 0; z-index: 5; pointer-events: none; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: max(14px, env(safe-area-inset-top)) 14px 0; }
.bar > * { pointer-events: auto; }
.sticker {
  display: inline-block; text-decoration: none; cursor: pointer; background: var(--paper); color: var(--ink);
  border: 3px solid var(--ink); border-radius: 12px; padding: 9px 14px; box-shadow: 3px 3px 0 var(--ink);
  font: 700 14px var(--hand); letter-spacing: 0.02em; -webkit-tap-highlight-color: transparent;
  transition: transform 0.12s, box-shadow 0.12s;
}
.sticker:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
.sticker:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.who { text-align: right; font: 700 14px/1.3 var(--hand); color: var(--paper); text-shadow: 0 2px 0 rgba(0,0,0,0.35); }
.who span { display: block; font: 600 11px var(--sans); letter-spacing: 0.14em; text-transform: uppercase; color: #cdbbf2; }
#openHint {
  position: absolute; left: 50%; bottom: max(8%, calc(env(safe-area-inset-bottom) + 28px)); z-index: 5; transform: translateX(-50%);
  background: var(--gold); color: var(--ink); border: 3px solid var(--ink); border-radius: 999px; padding: 14px 26px; cursor: pointer;
  font: 700 clamp(17px, 4.6vw, 22px) var(--hand); letter-spacing: 0.03em; box-shadow: 4px 4px 0 var(--ink); animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.07); } }
#openHint.gone { display: none; }
.nav {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 0 14px max(16px, env(safe-area-inset-bottom)); opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
}
.nav.show { opacity: 1; pointer-events: auto; }
.nav .sticker { min-width: 48px; text-align: center; }
.dots { display: flex; gap: 7px; align-items: center; padding: 0 4px; }
.dots button { width: 12px; height: 12px; padding: 0; border-radius: 50%; border: 2px solid var(--paper); background: transparent; cursor: pointer; }
.dots button.on { background: var(--gold); border-color: var(--gold); transform: scale(1.25); }
.count { font: 700 13px var(--hand); color: var(--paper); min-width: 44px; text-align: center; }

/* ---------- project note ---------- */
#note { position: fixed; inset: 0; z-index: 60; display: none; background: rgba(20, 12, 40, 0.78); overflow-y: auto; overscroll-behavior: contain; }
#note.open { display: block; }
.card {
  position: relative; max-width: 620px; margin: max(56px, env(safe-area-inset-top)) auto 40px; padding: 26px 22px 24px; background: var(--paper);
  border: 3px solid var(--ink); border-radius: 14px; box-shadow: 6px 6px 0 var(--ink); animation: rise 0.4s cubic-bezier(0.3, 1.4, 0.5, 1);
}
@keyframes rise { from { transform: translateY(30px) scale(0.96); opacity: 0; } to { transform: none; opacity: 1; } }
.card h2 { margin: 0; font: 700 clamp(28px, 8vw, 42px) / 1.05 var(--hand); }
.card .meta { margin: 8px 0 0; font: 600 12px var(--sans); letter-spacing: 0.14em; text-transform: uppercase; color: #7a5f92; }
.card p { margin: 16px 0 0; font: 17px / 1.55 var(--serif); }
.card dl { margin: 18px 0 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 15px; }
.card dt { font: 700 14px var(--hand); color: var(--red); }
.card dd { margin: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; padding: 0; list-style: none; }
.tags li { background: var(--gold); border: 2px solid var(--ink); border-radius: 999px; padding: 3px 12px; font: 700 13px var(--hand); transform: rotate(-1.5deg); }
.tags li:nth-child(even) { transform: rotate(1.5deg); background: #bfe3d0; }
.sample { display: inline-block; margin-top: 14px; padding: 4px 12px; border: 2px dashed var(--ink); border-radius: 8px; font: 700 12px var(--hand); letter-spacing: 0.04em; background: #fff1c9; }
.acts { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 10px; }
.x { position: absolute; top: 12px; right: 12px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- portal iris ---------- */
#iris { position: fixed; z-index: 90; display: none; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); border: 4px solid rgb(var(--pc)); box-shadow: 0 0 24px rgba(var(--pc), 0.7); }
#iris::before, #iris::after { content: ""; position: absolute; border-radius: 50%; border: 3px dashed rgba(var(--pc), 0.85); }
#iris::before { inset: -14px; animation: spin 2.4s linear infinite; }
#iris::after { inset: -28px; border-style: dotted; animation: spin 3.6s linear infinite reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
html.iris-on #iris { display: block; }
@media (prefers-reduced-motion: reduce) {
  .book, .back, .piece, .shadow, #openHint, #iris::before, #iris::after { transition: none !important; animation: none !important; }
  #openHint { transform: translateX(-50%); }
}
html.rm .book, html.rm .back, html.rm .piece, html.rm .shadow { transition: none !important; }
html.rm #openHint { animation: none; }
</style>
</head>
<body>
<div id="world">
  <header class="bar">
    <a class="sticker" href="hub-homepage.html" id="ret">Return to hub</a>
    <div class="who">Your Name<span>Illustrator</span></div>
  </header>

  <div class="stage" id="stage">
    <div class="book" id="book">
      <div class="shadowpool"></div>
      <div class="board"></div>
      <div class="base" id="base">
        <div class="pieces" id="pieces"></div>
        <div class="printed" id="printed"></div>
      </div>
      <div class="back" id="back">
        <div class="face front" id="backFront"></div>
        <div class="face rear" id="cover">
          <div class="cv">
            <svg viewBox="0 0 100 66" aria-hidden="true"><g id="coverArt"></g></svg>
            <div class="ct">POP-UP<br>BOOK</div>
            <div class="cs">Selected projects</div>
            <div class="cb">by Your Name</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <button id="openHint" type="button">Tap the cover to open</button>

  <div class="nav" id="nav">
    <button class="sticker" id="prev" type="button" aria-label="Previous page">&lt;</button>
    <div class="dots" id="dots" role="tablist" aria-label="Pages"></div>
    <button class="sticker" id="next" type="button" aria-label="Next page">&gt;</button>
    <button class="sticker" id="read" type="button">Read more</button>
  </div>
  <div class="sr" id="live" aria-live="polite"></div>
</div>

<div id="note" role="dialog" aria-modal="true" aria-labelledby="nTitle" aria-hidden="true">
  <div class="card" id="card"></div>
</div>
<div id="iris" aria-hidden="true"></div>

<script id="sound">
/* ---------- Sound: tiny synthesized effects, no audio files ----------
   Off until the visitor chooses sound on the hub. The choice is saved in the
   browser so every page follows it. Browsers only allow audio after a tap or
   click, so each page unlocks it on the first one. */
var Snd = (function () {
  var KEY = 'cas-portfolio-sound', ctx = null, master = null, noiseBuf = null, lastGesture = -1e9, last = {};
  function pref() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function set(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
  function on() { return pref() === 'on'; }
  function ensure() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }
      master = ctx.createGain();
      master.gain.value = 0.55;
      master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
    return ctx;
  }
  function gesture() { lastGesture = performance.now(); if (on()) ensure(); }
  ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, gesture, { passive: true, capture: true });
  });

  function env(g, t, a, peak, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  function tone(type, f0, f1, t, dur, peak, a) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    env(g, t, a || 0.012, peak, dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(t, dur, peak, type, f0, f1, q) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.6), ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    var s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf;
    f.type = type; f.Q.value = q || 1;
    f.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    env(g, t, 0.01, peak, dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t); s.stop(t + Math.min(dur + 0.05, 0.6));
  }

  var NOTES = [523.25, 587.33, 659.25, 783.99, 880, 987.77, 1046.5, 1174.66, 1318.51];
  var SOUNDS = {
    paper: function (t) { noise(t, 0.3, 0.035, 'bandpass', 900, 3200, 0.9); },
    blip: function (t) { tone('triangle', 880, 1320, t, 0.07, 0.025, 0.004); },
    zap: function (t) { tone('triangle', 260, 1500, t, 0.5, 0.035, 0.03); noise(t, 0.35, 0.012, 'bandpass', 600, 3200, 1.2); },
    lock: function (t) { tone('sine', 170, 110, t, 0.3, 0.09, 0.008); tone('triangle', 1175, 1568, t + 0.03, 0.14, 0.03, 0.005); },
    click: function (t) { tone('square', 700, 350, t, 0.05, 0.02, 0.003); },
    beep: function (t, f) { tone('square', f || 600, 0, t, 0.14, 0.02, 0.006); tone('sine', (f || 600) * 2, 0, t, 0.1, 0.01, 0.006); },
    buzz: function (t) { tone('sawtooth', 160, 150, t, 0.35, 0.035, 0.01); noise(t, 0.3, 0.015, 'bandpass', 900, 0, 2); },
    boing: function (t) { tone('sine', 180, 520, t, 0.12, 0.07, 0.005); tone('sine', 520, 220, t + 0.12, 0.28, 0.06, 0.005); },
    spin: function (t) { noise(t, 0.55, 0.03, 'bandpass', 300, 2200, 1.4); tone('triangle', 140, 420, t, 0.5, 0.02, 0.05); },
    chase: function (t) { [0, 1, 2, 3, 4].forEach(function (k) { tone('triangle', 660 + k * 110, 0, t + k * 0.07, 0.07, 0.02, 0.004); }); },
    hiss: function (t) { noise(t, 0.5, 0.03, 'highpass', 4000, 6000, 0.7); },
    spark: function (t) { noise(t, 0.12, 0.05, 'highpass', 3500, 0, 0.8); tone('triangle', 2200, 500, t, 0.14, 0.03, 0.004); },
    chime: function (t, i) {                       /* soft bell on a portal */
      var f = NOTES[(i || 0) % NOTES.length];
      tone('sine', f, 0, t, 0.7, 0.05, 0.01);
      tone('sine', f * 2, 0, t, 0.4, 0.015, 0.01);
    },
    open: function (t) {                           /* rising shimmer as a portal opens */
      tone('sine', 220, 660, t, 1.1, 0.05, 0.25);
      tone('triangle', 330, 990, t + 0.05, 1.0, 0.025, 0.25);
      [1318.51, 1567.98, 1975.53].forEach(function (f, k) { tone('sine', f, 0, t + 0.45 + k * 0.18, 0.5, 0.02, 0.01); });
    },
    close: function (t) {                          /* soft fall as a world closes */
      tone('sine', 660, 170, t, 0.7, 0.05, 0.02);
      noise(t, 0.5, 0.025, 'lowpass', 1800, 300, 0.7);
    },
    thunk: function (t) {                          /* a frame or panel opens */
      tone('sine', 190, 120, t, 0.28, 0.09, 0.008);
      tone('sine', 784, 0, t + 0.02, 0.35, 0.015, 0.01);
    },
    tick: function (t) {                           /* a paper tick */
      noise(t, 0.06, 0.05, 'highpass', 3200, 0, 0.8);
      tone('sine', 1500, 900, t, 0.05, 0.015, 0.004);
    },
    slam: function (t) {                           /* a comic panel lands */
      tone('sine', 150, 55, t, 0.22, 0.12, 0.006);
      noise(t, 0.12, 0.05, 'lowpass', 1200, 200, 0.7);
    },
    pop: function (t) {                            /* a sound effect word pops */
      tone('sine', 420, 140, t, 0.14, 0.09, 0.005);
    }
  };
  var MIN = { chime: 140, tick: 40, slam: 120, pop: 120, blip: 110, click: 40, beep: 60, spark: 80 };

  function play(name, arg) {
    if (!on() || !SOUNDS[name]) return;
    var now = performance.now();
    if (last[name] && now - last[name] < (MIN[name] || 60)) return;
    var c = ensure();
    if (!c) return;
    function go() { last[name] = performance.now(); SOUNDS[name](c.currentTime + 0.01, arg); }
    if (c.state === 'running') { go(); return; }
    /* still waking up: only play if this came from a tap or click just now */
    if (now - lastGesture < 1000 && c.resume) {
      c.resume().then(function () { if (performance.now() - lastGesture < 1500) go(); }).catch(function () {});
    }
  }
  /* Scroll flow: an airy whoosh that follows how fast the page is moving.
     It only exists while moving and fades out when scrolling stops. */
  var fl = null, flStop = 0, flowBuf = null;
  function flowKill() {
    if (!fl) return;
    try { fl.src.stop(); fl.o.stop(); } catch (e) {}
    fl = null;
  }
  function flowStart() {
    if (!flowBuf) {
      flowBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 2.5), ctx.sampleRate);
      var d = flowBuf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    var t = ctx.currentTime;
    var src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();

  if (!reduce) { Snd.play('pop'); later(function () { Snd.play('pop'); }, 140); later(function () { Snd.play('pop'); }, 300); }
}
function foldDown() { pieces.classList.remove('up'); }

/* cover art: a little paper castle and sun */
$('#coverArt').innerHTML = nest('sun', '#f6c453', '', 4, 0, 34, 34) + nest('castle', '#fffaf0', '#f6c453', 30, 8, 44, 58) + nest('hills', '#c2441f', '#a83a1a', 0, 36, 100, 30);

/* ---------------- open the cover, turn pages ---------------- */
function openBook() {
  if (isOpen || busy) return;
  busy = true; hint.classList.add('gone');
  Snd.play('paper');
  renderScene(cur);
  view.tilt = 52; isOpen = true; applyView(false);
  back.style.transform = 'rotateX(-76deg)';
  later(function () { popUp(); nav.classList.add('show'); busy = false; }, reduce ? 0 : 750);
}
function turnTo(n) {
  if (!isOpen || busy) return;
  n = (n + PROJECTS.length) % PROJECTS.length;
  if (n === cur) return;
  busy = true;
  if (reduce) { cur = n; renderScene(cur); popUp(); busy = false; return; }
  Snd.play('paper');
  foldDown();
  later(function () { back.classList.add('fast'); back.style.transform = 'rotateX(-24deg)'; }, 260);
  later(function () { cur = n; renderScene(cur); }, 640);
  later(function () { Snd.play('paper'); back.style.transform = 'rotateX(-76deg)'; }, 700);
  later(function () { back.classList.remove('fast'); popUp(); busy = false; }, 1250);
}
function buildDots() {
  var d = $('#dots'); d.innerHTML = '';
  PROJECTS.forEach(function (p, i) {
    var b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', 'Go to ' + p.title);
    b.addEventListener('click', function () { turnTo(i); });
    d.appendChild(b);
  });
}
buildDots();
$('#prev').addEventListener('click', function () { turnTo(cur - 1); });
$('#next').addEventListener('click', function () { turnTo(cur + 1); });
$('#read').addEventListener('click', function () { openNote(cur); });
hint.addEventListener('click', openBook);

/* ---------------- project note ---------------- */
var noteOpener = null;
function openNote(i) {
  var p = PROJECTS[i];
  noteOpener = document.activeElement;
  card.innerHTML = '<button class="sticker x" type="button" id="nClose">Close</button>' +
    '<h2 id="nTitle">' + esc(p.title) + '</h2><div class="meta">' + esc(p.year) + ' | ' + esc(p.category) + '</div>' +
    '<p>' + esc(p.description) + '</p>' +
    '<dl><dt>Role</dt><dd>' + esc(p.role) + '</dd><dt>Client</dt><dd>' + esc(p.client) + '</dd><dt>Tools</dt><dd>' + esc(p.tools) + '</dd></dl>' +
    '<ul class="tags">' + p.tags.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' +
    '<div class="sample">Sample project</div>' +
    '<div class="acts"><a class="sticker" href="' + esc(p.link || '#') + '" target="_blank" rel="noopener noreferrer">View full project</a></div>';
  note.classList.add('open'); note.setAttribute('aria-hidden', 'false'); note.scrollTop = 0;
  Snd.play('thunk');
  $('#nClose').focus();
}
function closeNote() {
  if (!note.classList.contains('open')) return;
  note.classList.remove('open'); note.setAttribute('aria-hidden', 'true');
  Snd.play('tick');
  if (noteOpener && noteOpener.focus) { try { noteOpener.focus({ preventScroll: true }); } catch (e) {} }
}
note.addEventListener('click', function (e) { if (e.target === note || e.target.id === 'nClose') closeNote(); });

/* ---------------- touch and mouse: drag to look around, tap a piece ---------------- */
var ptrs = {}, moved = 0, t0 = 0, startTarget = null, pinch = 0;
function ids() { return Object.keys(ptrs); }
stage.addEventListener('pointerdown', function (e) {
  if (note.classList.contains('open')) return;
  try { stage.setPointerCapture(e.pointerId); } catch (er) {}
  ptrs[e.pointerId] = [e.clientX, e.clientY];
  if (ids().length === 1) { moved = 0; t0 = performance.now(); startTarget = e.target; stage.classList.add('grabbing'); }
  else if (ids().length === 2) { var k = ids(); pinch = Math.hypot(ptrs[k[0]][0] - ptrs[k[1]][0], ptrs[k[0]][1] - ptrs[k[1]][1]); }
});
stage.addEventListener('pointermove', function (e) {
  if (!ptrs[e.pointerId]) return;
  var prev = ptrs[e.pointerId]; ptrs[e.pointerId] = [e.clientX, e.clientY];
  if (ids().length === 1) {
    var dx = e.clientX - prev[0], dy = e.clientY - prev[1];
    moved += Math.abs(dx) + Math.abs(dy);
    if (moved > 8 && isOpen) { view.rot = clamp(view.rot + dx * 0.18, -40, 40); view.tilt = clamp(view.tilt - dy * 0.18, 22, 74); applyView(true); }
  } else if (ids().length === 2) {
    var k = ids(), d = Math.hypot(ptrs[k[0]][0] - ptrs[k[1]][0], ptrs[k[0]][1] - ptrs[k[1]][1]);
    if (pinch > 0 && d > 0) { view.zoom = clamp(view.zoom * d / pinch, 0.6, 1.7); applyView(true); }
    pinch = d; moved += 20;
  }
});
function endPtr(e) {
  if (!ptrs[e.pointerId]) return;
  delete ptrs[e.pointerId];
  if (ids().length === 0) {
    stage.classList.remove('grabbing'); pinch = 0;
    if (e.type === 'pointerup' && moved < 9 && performance.now() - t0 < 600) tapAt(startTarget);
  }
}
stage.addEventListener('pointerup', endPtr);
stage.addEventListener('pointercancel', endPtr);
stage.addEventListener('wheel', function (e) { e.preventDefault(); view.zoom = clamp(view.zoom * Math.exp(-e.deltaY * 0.0012), 0.6, 1.7); applyView(true); }, { passive: false });
stage.addEventListener('dblclick', function () { if (isOpen) { view.rot = 0; view.tilt = 52; view.zoom = 1; applyView(false); } });
function tapAt(el) {
  if (!isOpen) { if (el && el.closest && el.closest('.back, .book')) openBook(); return; }
  var pc = el && el.closest ? el.closest('.piece') : null;
  if (!pc) { Snd.play('paper'); return; }
  pc.classList.remove('boing'); void pc.offsetWidth; pc.classList.add('boing');
  setTimeout(function () { pc.classList.remove('boing'); }, 650);
  if (pc.getAttribute('data-banner')) { Snd.play('boing'); openNote(cur); }
  else { Snd.play(Math.random() > 0.5 ? 'boing' : 'pop'); }
}

/* keyboard */
document.addEventListener('keydown', function (e) {
  if (note.classList.contains('open')) { if (e.key === 'Escape') closeNote(); return; }
  if (!isOpen) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openBook(); } return; }
  if (e.key === 'ArrowRight') turnTo(cur + 1);
  else if (e.key === 'ArrowLeft') turnTo(cur - 1);
  else if (e.key === 'Enter' && document.activeElement === document.body) openNote(cur);
});

/* ---------------- portal travel (arrival and leaving) ---------------- */
var world = $('#world'), iris = $('#iris');
function run(duration, fn, done) {
  var t0 = null, finished = false;
  function end() { if (finished) return; finished = true; fn(1); if (done) done(); }
  function step(ts) { if (finished) return; if (t0 === null) t0 = ts; var t = Math.min(1, (ts - t0) / duration); fn(easeIO(t)); if (t < 1) requestAnimationFrame(step); else end(); }
  requestAnimationFrame(step);
  setTimeout(end, duration + 700);
}
var params = new URLSearchParams(location.search);
var fromPortal = !!params.get('portal');
var pcol = (params.get('c') || '180,140,255').split(',').map(Number);
if (pcol.length !== 3 || pcol.some(isNaN)) pcol = [180, 140, 255];
var ox = parseFloat(params.get('x')), oy = parseFloat(params.get('y')), opx = parseFloat(params.get('px')), opy = parseFloat(params.get('py'));
if (isNaN(ox)) ox = 0.5; if (isNaN(oy)) oy = 0.5;
root.style.setProperty('--pc', pcol.join(','));
function irisGeometry() {
  var w = window.innerWidth, h = window.innerHeight, cx = ox * w, cy = oy * h;
  if (isFinite(opx) && isFinite(opy)) { cx = clamp(opx, 0, w); cy = clamp(opy, 0, h); }
  var R = Math.max(Math.hypot(cx, cy), Math.hypot(w - cx, cy), Math.hypot(cx, h + 160 - cy), Math.hypot(w - cx, h + 160 - cy)) + 40;
  return { cx: cx, cy: cy, R: R };
}
function setIris(g, r) {
  world.style.clipPath = 'circle(' + r.toFixed(1) + 'px at ' + g.cx.toFixed(1) + 'px ' + g.cy.toFixed(1) + 'px)';
  iris.style.left = g.cx + 'px'; iris.style.top = g.cy + 'px'; iris.style.width = iris.style.height = (2 * r) + 'px';
}
function clearIris() { root.classList.remove('iris-on', 'portal-in'); root.style.background = ''; world.style.clipPath = ''; }
var leaving = false;
function leave(href) {
  if (leaving) return; leaving = true;
  Snd.play('close');
  var url = href + (href.indexOf('?') > -1 ? '&' : '?') + 'from=pop-up-book&c=' + pcol.join(',');
  if (reduce) { location.href = url; return; }
  var g = irisGeometry();
  root.style.background = 'rgb(' + pcol.join(',') + ')';
  root.classList.add('iris-on'); setIris(g, g.R);
  run(850, function (t) { setIris(g, g.R * (1 - t)); }, function () { location.href = url; });
}
document.addEventListener('click', function (e) {
  var a = e.target.closest && e.target.closest('a[href="hub-homepage.html"]');
  if (!a || e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button > 0) return;
  e.preventDefault(); leave('hub-homepage.html');
});
window.addEventListener('pageshow', function (e) { if (e.persisted) { leaving = false; clearIris(); } });
window.addEventListener('resize', function () { applyView(false); });

/* ---------------- start ---------------- */
applyView(false);
if (fromPortal && !reduce) {
  var g0 = irisGeometry(); root.classList.add('iris-on'); setIris(g0, 0);
  run(950, function (t) { setIris(g0, g0.R * t); }, function () { clearIris(); });
} else if (fromPortal) { clearIris(); }
</script>
