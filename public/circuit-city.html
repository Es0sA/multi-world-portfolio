<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Circuit City | Board Rev 3.0</title>
<meta name="theme-color" content="#03140b">
<script>
/* Portal arrival: read the hub's query string before first paint. */
(function () {
  try {
    var q = new URLSearchParams(location.search);
    if (q.get('portal')) {
      var c = (q.get('c') || '77,166,255').split(',').map(Number);
      if (c.length !== 3 || c.some(isNaN)) c = [77, 166, 255];
      var x = parseFloat(q.get('x')), y = parseFloat(q.get('y'));
      if (isNaN(x)) x = 0.5;
      if (isNaN(y)) y = 0.5;
      var d = document.documentElement;
      d.classList.add('portal-in');
      d.style.setProperty('--pc', c.join(','));
      d.style.setProperty('--px', (x * 100) + '%');
      d.style.setProperty('--py', (y * 100) + '%');
      var qx = parseFloat(q.get('px')), qy = parseFloat(q.get('py'));
      if (isFinite(qx) && isFinite(qy)) {
        d.style.setProperty('--px', qx + 'px');
        d.style.setProperty('--py', qy + 'px');
      }
    }
  } catch (e) {}
})();
</script>
<style>
:root {
  --bg: #03140b;
  --cy: #6dffb0;
  --ice: #e4fff0;
  --dim: #86b59a;
  --line: rgba(109, 255, 176, 0.32);
  --panel: rgba(4, 22, 13, 0.82);
  --gold: #e8c25a;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --pc: 77, 166, 255;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); color: var(--ice); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
html.portal-in { background: rgb(var(--pc)); }
html.portal-in #world { clip-path: circle(0 at var(--px) var(--py)); }
body { background: transparent; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cy); outline-offset: 2px; }

#world { position: fixed; inset: 0; background: var(--bg); overflow: hidden; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
#gl.grabbing { cursor: grabbing; }
#gl.pointing { cursor: pointer; }
#gl:focus-visible { outline: 2px solid var(--cy); outline-offset: -4px; }
#lab { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.tip {
  position: absolute; z-index: 6; left: 0; top: 0; pointer-events: none; display: none;
  padding: 6px 10px; font: 12px var(--mono); letter-spacing: 0.04em; background: var(--panel); border: 1px solid var(--line); white-space: nowrap;
}

/* ---------- top bar ---------- */
.bar {
  position: absolute; left: 0; right: 0; top: 0; z-index: 5; pointer-events: none;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding: max(14px, env(safe-area-inset-top)) 14px 0; font-family: var(--mono);
}
.bar > * { pointer-events: auto; }
.return {
  color: var(--ice);
  display: inline-flex; align-items: center; gap: 10px; text-decoration: none;
  font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
  padding: 10px 14px; border: 1px solid var(--line); background: var(--panel);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.return::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--cy); box-shadow: 0 0 8px var(--cy); }
.return:hover { border-color: var(--cy); }
.who { text-align: right; font-size: 11px; letter-spacing: 0.1em; line-height: 1.4; text-transform: uppercase; color: var(--dim); text-shadow: 0 0 10px #03140b; }
.who b { display: block; color: var(--ice); font-weight: 600; font-size: 12px; }

/* ---------- hud ---------- */
.hint {
  position: absolute; left: 50%; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 66px); z-index: 4;
  transform: translateX(-50%); width: max-content; max-width: 88%;
  padding: 8px 14px; font: 12px var(--mono); letter-spacing: 0.05em; text-align: center; line-height: 1.5;
  background: var(--panel); border: 1px solid var(--line); pointer-events: none; transition: opacity 0.6s ease;
}
.hint.gone { opacity: 0; }
.hud {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; pointer-events: none;
  display: flex; justify-content: space-between; align-items: flex-end; gap: 10px;
  padding: 0 14px max(14px, env(safe-area-inset-bottom));
}
.hud > * { pointer-events: auto; }
#mini { width: 120px; height: 80px; border: 1px solid var(--line); background: rgba(3, 16, 9, 0.85); touch-action: none; cursor: crosshair; }
.hbtn {
  height: 44px; padding: 0 14px; min-width: 44px; cursor: pointer;
  font: 12px var(--mono); letter-spacing: 0.12em; text-transform: uppercase;
  background: var(--panel); border: 1px solid var(--line); color: var(--ice);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); -webkit-tap-highlight-color: transparent;
}
.hbtn:hover { border-color: var(--cy); }
.ctrls { display: grid; grid-template-columns: 44px 44px; gap: 6px; }
.ctrls .hbtn { padding: 0; font-size: 16px; letter-spacing: 0; }
.ctrls .wide { grid-column: span 2; font-size: 11px; letter-spacing: 0.12em; }

/* ---------- parts list ---------- */
#parts {
  position: absolute; left: 50%; bottom: 0; z-index: 8; transform: translate(-50%, 100%);
  width: min(580px, 100%); max-height: 72%; overflow-y: auto; overscroll-behavior: contain;
  background: rgba(3, 17, 10, 0.97); border: 1px solid var(--line); border-bottom: 0;
  padding: 16px 14px max(18px, env(safe-area-inset-bottom)); transition: transform 0.3s ease; visibility: hidden;
}
#parts.open { transform: translate(-50%, 0); visibility: visible; }
#parts h2 { margin: 0 0 12px; font: 600 12px var(--mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--cy); display: flex; justify-content: space-between; align-items: center; }
#parts h2 button { background: none; border: 1px solid var(--line); padding: 6px 12px; cursor: pointer; font: 11px var(--mono); letter-spacing: 0.1em; }
#parts ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
#parts li button {
  width: 100%; text-align: left; display: grid; grid-template-columns: 10px 1fr auto; gap: 12px; align-items: center;
  padding: 11px 12px; cursor: pointer; background: rgba(8, 36, 20, 0.7); border: 1px solid rgba(109, 255, 176, 0.18);
}
#parts li button:hover { border-color: var(--cy); }
#parts li .dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 8px currentColor; background: currentColor; }
#parts li b { display: block; font: 600 14px var(--sans); }
#parts li span { display: block; font: 12px var(--sans); color: var(--dim); }
#parts li em { font: normal 11px var(--mono); color: var(--dim); letter-spacing: 0.08em; text-align: right; }
#parts li em.s { color: var(--gold); }
#fallback { position: absolute; z-index: 7; left: 14px; right: 14px; top: 70px; padding: 14px; font: 13px/1.5 var(--mono); background: var(--panel); border: 1px solid var(--line); display: none; }
#fallback.show { display: block; }

/* ---------- dossier ---------- */
#dossier {
  position: fixed; inset: 0; z-index: 60; display: none;
  background: rgba(2, 10, 6, 0.88); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  overflow-y: auto; overscroll-behavior: contain;
}
#dossier.open { display: block; }
.sheet { max-width: 980px; margin: 0 auto; min-height: 100%; padding: 0 clamp(16px, 4vw, 32px) max(48px, env(safe-area-inset-bottom)); }
.dbar {
  position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: max(14px, env(safe-area-inset-top)) 0 12px; font: 12px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim);
  background: linear-gradient(#020a06 70%, rgba(2, 10, 6, 0));
}
.dbar .led { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; background: currentColor; box-shadow: 0 0 10px currentColor; }
.dclose { cursor: pointer; padding: 10px 16px; background: var(--panel); border: 1px solid var(--line); font: 12px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; }
.dclose:hover { border-color: var(--cy); }
.sheet h2 { margin: 18px 0 0; font: 700 clamp(2rem, 7vw, 3.6rem)/1 var(--sans); letter-spacing: -0.01em; }
.sheet .tag { margin: 10px 0 0; font-size: clamp(1rem, 2.4vw, 1.2rem); color: var(--dim); max-width: 36em; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 0; padding: 0; list-style: none; }
.chips li { padding: 5px 11px; border: 1px solid var(--line); font: 12px var(--mono); letter-spacing: 0.06em; }
.chips li.real { border-color: var(--cy); color: var(--cy); }
.chips li.sample { border-color: var(--gold); color: var(--gold); }
.note { margin: 16px 0 0; padding: 10px 14px; max-width: 42em; font-size: 13px; line-height: 1.5; border-left: 3px solid var(--gold); background: rgba(232, 194, 90, 0.08); color: #f3deaa; }
.sec { margin-top: 32px; }
.sec h3 { margin: 0 0 12px; font: 600 12px var(--mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--cy); }
.sec p { margin: 0; max-width: 42em; line-height: 1.6; }
.metrics { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.metrics div { padding: 14px; background: rgba(8, 36, 20, 0.6); border: 1px solid var(--line); }
.metrics b { display: block; font: 600 clamp(1.1rem, 3.4vw, 1.5rem) var(--mono); color: var(--ice); overflow-wrap: anywhere; }
.metrics span { display: block; margin-top: 4px; font-size: 12px; color: var(--dim); letter-spacing: 0.03em; }
.points { margin: 0; padding: 0 0 0 18px; display: grid; gap: 8px; max-width: 42em; line-height: 1.55; }
.flow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.flow .node { padding: 8px 12px; border: 1px solid var(--line); background: rgba(8, 36, 20, 0.6); font: 13px var(--mono); }
.flow i { font-style: normal; color: var(--cy); }
.pins { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
.pins li { padding: 5px 10px; background: rgba(232, 194, 90, 0.12); border: 1px solid rgba(232, 194, 90, 0.5); color: #f0dc9c; font: 12px var(--mono); }
pre { margin: 0; padding: 14px; overflow-x: auto; background: #020a06; border: 1px solid var(--line); font: 13px/1.6 var(--mono); color: #c8f5da; -webkit-overflow-scrolling: touch; }
pre.log { color: #8dffbf; min-height: 9.5em; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 32px; }
.timeline { list-style: none; margin: 0; padding: 0 0 0 16px; border-left: 1px solid var(--line); display: grid; gap: 14px; }
.timeline li { position: relative; }
.timeline li::before { content: ""; position: absolute; left: -21px; top: 7px; width: 9px; height: 9px; border-radius: 50%; background: var(--cy); box-shadow: 0 0 8px var(--cy); }
.timeline b { font: 600 12px var(--mono); color: var(--cy); display: block; letter-spacing: 0.08em; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.actions a, .actions button {
  display: inline-block; padding: 11px 18px; cursor: pointer; text-decoration: none;
  background: rgba(8, 36, 20, 0.8); border: 1px solid var(--line); color: var(--ice); font: 13px var(--mono); letter-spacing: 0.04em;
}
.actions a:hover, .actions button:hover { border-color: var(--cy); background: rgba(14, 60, 34, 0.8); }
.actions .main { background: var(--cy); border-color: var(--cy); color: #03160c; font-weight: 700; }
.actions .main:hover { background: #a6ffd0; }
@media (max-width: 720px) { .cols { grid-template-columns: 1fr; } }

/* ---------- boot curtain (direct visits only) ---------- */
#curtain {
  position: fixed; inset: 0; z-index: 80; display: none; background: #020a06; color: #8dffbf; cursor: pointer;
  padding: max(28px, env(safe-area-inset-top)) 22px 28px; font: 14px/1.9 var(--mono); transition: opacity 0.45s ease;
}
#curtain.show { display: block; }
#curtain.gone { opacity: 0; }
#curtain .ln { opacity: 0; animation: ln 0.01s forwards; white-space: pre-wrap; }
#curtain .big { display: block; margin-bottom: 14px; font-size: clamp(1.6rem, 6vw, 2.6rem); font-weight: 700; color: var(--ice); letter-spacing: 0.04em; }
#curtain .skip { position: absolute; left: 22px; right: 22px; bottom: max(22px, env(safe-area-inset-bottom)); opacity: 0.6; font-size: 12px; }
@keyframes ln { to { opacity: 1; } }

/* ---------- portal iris ---------- */
#iris { position: fixed; z-index: 90; display: none; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); border: 4px solid rgb(var(--pc)); box-shadow: 0 0 24px rgba(var(--pc), 0.7); }
#iris::before, #iris::after { content: ""; position: absolute; border-radius: 50%; border: 3px dashed rgba(var(--pc), 0.85); }
#iris::before { inset: -14px; animation: spin 2.4s linear infinite; }
#iris::after { inset: -28px; border-style: dotted; animation: spin 3.6s linear infinite reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
html.iris-on #iris { display: block; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { #iris::before, #iris::after { animation: none; } #parts { transition: none; } }
</style>
</head>
<body>
<div id="world">
  <canvas id="gl" tabindex="0" aria-label="3D circuit board. Drag to move. Two fingers to zoom, twist and tilt. On a computer, right-drag to rotate and scroll to zoom. Arrow keys pan, Q and E rotate, R and F tilt, plus and minus zoom. Use the parts list to jump to a project."></canvas>
  <canvas id="lab" aria-hidden="true"></canvas>
  <div class="tip" id="tip"></div>

  <header class="bar">
    <a class="return" href="hub-homepage.html">Return to hub</a>
    <div class="who"><b>Your Name</b>Software Developer</div>
  </header>

  <div class="hint" id="hint"></div>
  <div id="fallback" role="status"></div>

  <div class="hud">
    <canvas id="mini" aria-hidden="true"></canvas>
    <button class="hbtn" id="partsBtn" type="button" aria-expanded="false" aria-controls="parts">Parts list</button>
    <div class="ctrls">
      <button class="hbtn" id="zin" type="button" aria-label="Zoom in">+</button>
      <button class="hbtn" id="zout" type="button" aria-label="Zoom out">-</button>
      <button class="hbtn" id="rotL" type="button" aria-label="Rotate left">&#8634;</button>
      <button class="hbtn" id="rotR" type="button" aria-label="Rotate right">&#8635;</button>
      <button class="hbtn wide" id="tilt" type="button" aria-label="Change tilt">Tilt</button>
    </div>
  </div>

  <section id="parts" aria-label="Parts list">
    <h2>Parts list <button type="button" id="partsClose">Close</button></h2>
    <ul id="partsUl"></ul>
  </section>

  <div class="sr" id="live" aria-live="polite"></div>
</div>

<div id="dossier" role="dialog" aria-modal="true" aria-labelledby="dname" aria-hidden="true">
  <div class="sheet" id="sheet"></div>
</div>

<div id="curtain" aria-hidden="true"></div>
<div id="iris" aria-hidden="true"></div>

<script id="sound">
/* ---------- Sound: tiny synthesized effects, no audio files ----------
   Off until the visitor chooses sound on the hub. The choice is saved in the
   browser so every page follows it. Browsers only allow audio after a tap or
   click, so each page unlocks it on the first one. */
var Snd = (function () {
  var KEY = 'cas-portfolio-sound', ctx = null, master = null, noiseBuf = null, lastGesture = -1e9, last = {};
  function pref() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function set(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
  function on() { return pref() === 'on'; }
  function ensure() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }
      master = ctx.createGain();
      master.gain.value = 0.55;
      master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
    return ctx;
  }
  function gesture() { lastGesture = performance.now(); if (on()) ensure(); }
  ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, gesture, { passive: true, capture: true });
  });

  function env(g, t, a, peak, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  function tone(type, f0, f1, t, dur, peak, a) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    env(g, t, a || 0.012, peak, dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(t, dur, peak, type, f0, f1, q) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.6), ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    var s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf;
    f.type = type; f.Q.value = q || 1;
    f.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    env(g, t, 0.01, peak, dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t); s.stop(t + Math.min(dur + 0.05, 0.6));
  }

  var NOTES = [523.25, 587.33, 659.25, 783.99, 880, 987.77, 1046.5, 1174.66, 1318.51];
  var SOUNDS = {
    blip: function (t) { tone('triangle', 880, 1320, t, 0.07, 0.025, 0.004); },
    zap: function (t) { tone('triangle', 260, 1500, t, 0.5, 0.035, 0.03); noise(t, 0.35, 0.012, 'bandpass', 600, 3200, 1.2); },
    lock: function (t) { tone('sine', 170, 110, t, 0.3, 0.09, 0.008); tone('triangle', 1175, 1568, t + 0.03, 0.14, 0.03, 0.005); },
    click: function (t) { tone('square', 700, 350, t, 0.05, 0.02, 0.003); },
    beep: function (t, f) { tone('square', f || 600, 0, t, 0.14, 0.02, 0.006); tone('sine', (f || 600) * 2, 0, t, 0.1, 0.01, 0.006); },
    buzz: function (t) { tone('sawtooth', 160, 150, t, 0.35, 0.035, 0.01); noise(t, 0.3, 0.015, 'bandpass', 900, 0, 2); },
    boing: function (t) { tone('sine', 180, 520, t, 0.12, 0.07, 0.005); tone('sine', 520, 220, t + 0.12, 0.28, 0.06, 0.005); },
    spin: function (t) { noise(t, 0.55, 0.03, 'bandpass', 300, 2200, 1.4); tone('triangle', 140, 420, t, 0.5, 0.02, 0.05); },
    chase: function (t) { [0, 1, 2, 3, 4].forEach(function (k) { tone('triangle', 660 + k * 110, 0, t + k * 0.07, 0.07, 0.02, 0.004); }); },
    hiss: function (t) { noise(t, 0.5, 0.03, 'highpass', 4000, 6000, 0.7); },
    spark: function (t) { noise(t, 0.12, 0.05, 'highpass', 3500, 0, 0.8); tone('triangle', 2200, 500, t, 0.14, 0.03, 0.004); },
    chime: function (t, i) {                       /* soft bell on a portal */
      var f = NOTES[(i || 0) % NOTES.length];
      tone('sine', f, 0, t, 0.7, 0.05, 0.01);
      tone('sine', f * 2, 0, t, 0.4, 0.015, 0.01);
    },
    open: function (t) {                           /* rising shimmer as a portal opens */
      tone('sine', 220, 660, t, 1.1, 0.05, 0.25);
      tone('triangle', 330, 990, t + 0.05, 1.0, 0.025, 0.25);
      [1318.51, 1567.98, 1975.53].forEach(function (f, k) { tone('sine', f, 0, t + 0.45 + k * 0.18, 0.5, 0.02, 0.01); });
    },
    close: function (t) {                          /* soft fall as a world closes */
      tone('sine', 660, 170, t, 0.7, 0.05, 0.02);
      noise(t, 0.5, 0.025, 'lowpass', 1800, 300, 0.7);
    },
    thunk: function (t) {                          /* a frame or panel opens */
      tone('sine', 190, 120, t, 0.28, 0.09, 0.008);
      tone('sine', 784, 0, t + 0.02, 0.35, 0.015, 0.01);
    },
    tick: function (t) {                           /* a paper tick */
      noise(t, 0.06, 0.05, 'highpass', 3200, 0, 0.8);
      tone('sine', 1500, 900, t, 0.05, 0.015, 0.004);
    },
    slam: function (t) {                           /* a comic panel lands */
      tone('sine', 150, 55, t, 0.22, 0.12, 0.006);
      noise(t, 0.12, 0.05, 'lowpass', 1200, 200, 0.7);
    },
    pop: function (t) {                            /* a sound effect word pops */
      tone('sine', 420, 140, t, 0.14, 0.09, 0.005);
    }
  };
  var MIN = { chime: 140, tick: 40, slam: 120, pop: 120, blip: 110, click: 40, beep: 60, spark: 80 };

  function play(name, arg) {
    if (!on() || !SOUNDS[name]) return;
    var now = performance.now();
    if (last[name] && now - last[name] < (MIN[name] || 60)) return;
    var c = ensure();
    if (!c) return;
    function go() { last[name] = performance.now(); SOUNDS[name](c.currentTime + 0.01, arg); }
    if (c.state === 'running') { go(); return; }
    /* still waking up: only play if this came from a tap or click just now */
    if (now - lastGesture < 1000 && c.resume) {
      c.resume().then(function () { if (performance.now() - lastGesture < 1500) go(); }).catch(function () {});
    }
  }
  /* Scroll flow: an airy whoosh that follows how fast the page is moving.

    ul.appendChild(li);
  });
  ul.addEventListener('click', function (e) { var b = e.target.closest('button[data-i]'); if (b) routeTo(+b.getAttribute('data-i')); });
})();
function openParts() { partsEl.classList.add('open'); partsBtn.setAttribute('aria-expanded', 'true'); Snd.play('tick'); var f = partsEl.querySelector('button[data-i]'); if (f) f.focus(); }
function closeParts() { if (!partsEl.classList.contains('open')) return; partsEl.classList.remove('open'); partsBtn.setAttribute('aria-expanded', 'false'); }
partsBtn.addEventListener('click', function () { partsEl.classList.contains('open') ? closeParts() : openParts(); });
$('#partsClose').addEventListener('click', function () { closeParts(); partsBtn.focus(); });

/* ---------------- dossier ---------------- */
var dossier = $('#dossier'), sheet = $('#sheet'), dossierOpen = false, lastFocus = null, logTimers = [];
function openDossier(i) {
  var n = NODES[i];
  lastFocus = document.activeElement;
  var nb = neighbours[i].map(function (x) { return x.to; }).filter(function (v, k, a) { return a.indexOf(v) === k; });
  var kind = n.id === 'core' || n.id === 'io' ? '' : n.real ? '<li class="real">Real project</li>' : '<li class="sample">Sample project</li>';
  var h = '';
  h += '<div class="dbar"><span style="color:' + n.color + '"><i class="led"></i>' + esc(n.part) + '</span><button class="dclose" type="button" data-close>Close</button></div>';
  h += '<h2 id="dname">' + esc(n.name) + '</h2><p class="tag">' + esc(n.tag) + '</p>';
  h += '<ul class="chips">' + kind + '<li>' + esc(n.type) + '</li><li>' + esc(n.year) + '</li><li>' + esc(n.role) + '</li><li>' + esc(n.status) + '</li></ul>';
  if (!n.real) h += '<p class="note">Sample project. It is an example of how a client\'s work could be presented on a board like this. The details and figures are made up for the demo.</p>';
  h += '<div class="sec"><h3>Spec sheet</h3><div class="metrics">' + n.metrics.map(function (m) { return '<div><b>' + esc(m[1]) + '</b><span>' + esc(m[0]) + '</span></div>'; }).join('') + '</div></div>';
  h += '<div class="sec"><h3>Overview</h3><p>' + esc(n.about) + '</p></div>';
  h += '<div class="sec"><h3>Highlights</h3><ul class="points">' + n.points.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul></div>';
  h += '<div class="sec"><h3>Signal path</h3><div class="flow">' + n.arch.map(function (a, k) { return (k ? '<i>&rarr;</i>' : '') + '<span class="node">' + esc(a) + '</span>'; }).join('') + '</div></div>';
  h += '<div class="sec"><h3>Pins (stack)</h3><ul class="pins">' + n.stack.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul></div>';
  h += '<div class="sec cols"><div><h3>' + (n.codeNote ? 'Snippet (illustration)' : 'Snippet') + '</h3><pre><code>' + esc(n.code.join('\n')) + '</code></pre></div><div><h3>Boot log</h3><pre class="log" id="logBox"></pre></div></div>';
  h += '<div class="sec"><h3>Timeline</h3><ul class="timeline">' + n.timeline.map(function (t) { return '<li><b>' + esc(t[0]) + '</b>' + esc(t[1]) + '</li>'; }).join('') + '</ul></div>';
  var acts = '';
  if (n.links.repo) acts += '<a class="main" href="' + esc(n.links.repo) + '" target="_blank" rel="noopener noreferrer">View repository</a>';
  if (n.links.demo) acts += '<a href="' + esc(n.links.demo) + '" target="_blank" rel="noopener noreferrer">' + esc(n.links.demoLabel || 'Live demo') + '</a>';
  if (n.links.email) acts += '<a class="main" href="mailto:' + esc(n.links.email) + '">' + esc(n.links.email) + '</a>';
  if (acts) h += '<div class="sec"><h3>Open</h3><div class="actions">' + acts + '</div></div>';
  h += '<div class="sec"><h3>Connected to (follow a trace)</h3><div class="actions">' + nb.map(function (j) { return '<button type="button" data-go="' + j + '">' + esc(NODES[j].name) + '</button>'; }).join('') + '</div></div>';
  sheet.innerHTML = h;
  dossier.classList.add('open'); dossier.setAttribute('aria-hidden', 'false'); dossierOpen = true;
  dossier.scrollTop = 0;
  cur = i; ptrActive = false; ptrScreen = null; hoverNode = -1; tip.style.display = 'none';
  var box = $('#logBox'); logTimers.forEach(clearTimeout); logTimers = [];
  if (reduce) box.textContent = n.log.join('\n');
  else n.log.forEach(function (ln, k) { logTimers.push(setTimeout(function () { box.textContent += (k ? '\n' : '') + ln; }, 250 + k * 320)); });
  live('Opened ' + n.name);
  var c = sheet.querySelector('.dclose'); if (c) c.focus();
}
function closeDossier(silent) {
  if (!dossierOpen) return;
  dossier.classList.remove('open'); dossier.setAttribute('aria-hidden', 'true'); dossierOpen = false;
  logTimers.forEach(clearTimeout); logTimers = [];
  if (!silent) Snd.play('tick');
  if (lastFocus && lastFocus.focus) { try { lastFocus.focus({ preventScroll: true }); } catch (e) {} }
}
dossier.addEventListener('click', function (e) {
  if (e.target.closest('[data-close]') || e.target === dossier) { closeDossier(); return; }
  var g = e.target.closest('[data-go]');
  if (g) { closeDossier(true); routeTo(+g.getAttribute('data-go')); }
});
document.addEventListener('keydown', function (e) {
  if (!dossierOpen) { if (e.key === 'Escape') closeParts(); return; }
  if (e.key === 'Escape') { closeDossier(); return; }
  if (e.key === 'Tab') {
    var f = [].slice.call(dossier.querySelectorAll('button, a[href]'));
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

/* ---------------- portal travel (arrival, curtain, leaving) ---------------- */
var world = $('#world'), iris = $('#iris');
function run(duration, fn, done) {
  var t0 = null, finished = false;
  function end() { if (finished) return; finished = true; fn(1); if (done) done(); }
  function step(ts) { if (finished) return; if (t0 === null) t0 = ts; var t = Math.min(1, (ts - t0) / duration); fn(easeIO(t)); if (t < 1) requestAnimationFrame(step); else end(); }
  requestAnimationFrame(step);
  setTimeout(end, duration + 700);
}
var params = new URLSearchParams(location.search);
var fromPortal = !!params.get('portal');
var pcol = (params.get('c') || '77,166,255').split(',').map(Number);
if (pcol.length !== 3 || pcol.some(isNaN)) pcol = [77, 166, 255];
var ox = parseFloat(params.get('x')), oy = parseFloat(params.get('y')), opx = parseFloat(params.get('px')), opy = parseFloat(params.get('py'));
if (isNaN(ox)) ox = 0.5; if (isNaN(oy)) oy = 0.5;
root.style.setProperty('--pc', pcol.join(','));
function irisGeometry() {
  var w = window.innerWidth, h = window.innerHeight, cx = ox * w, cy = oy * h;
  if (isFinite(opx) && isFinite(opy)) { cx = clamp(opx, 0, w); cy = clamp(opy, 0, h); }
  var R = Math.max(Math.hypot(cx, cy), Math.hypot(w - cx, cy), Math.hypot(cx, h + 160 - cy), Math.hypot(w - cx, h + 160 - cy)) + 40;
  return { cx: cx, cy: cy, R: R };
}
function setIris(g, r) {
  world.style.clipPath = 'circle(' + r.toFixed(1) + 'px at ' + g.cx.toFixed(1) + 'px ' + g.cy.toFixed(1) + 'px)';
  iris.style.left = g.cx + 'px'; iris.style.top = g.cy + 'px'; iris.style.width = iris.style.height = (2 * r) + 'px';
}
function clearIris() { root.classList.remove('iris-on', 'portal-in'); root.style.background = ''; world.style.clipPath = ''; }

var curtain = $('#curtain'), curtainDone = false;
function dismissCurtain() {
  if (curtainDone) return; curtainDone = true;
  curtain.classList.add('gone');
  setTimeout(function () { curtain.classList.remove('show'); curtain.style.display = 'none'; }, reduce ? 0 : 480);
}
function playCurtain() {
  var real = PROJECTS.filter(function (p) { return p.real; }).length;
  var lines = ['<span class="big">CIRCUIT CITY BIOS v3.0</span>', 'Memory test ............ OK', 'Detecting chips ........ ' + (NODES.length - 1) + ' found', 'Real projects .......... ' + real, 'Sample projects ........ ' + (PROJECTS.length - real), 'Tracing buses .......... ' + edgeDefs.length + ' linked', '', 'Press any key to boot'];
  curtain.innerHTML = lines.map(function (l, k) { return '<div class="ln" style="animation-delay:' + (reduce ? 0 : 0.15 + k * 0.3).toFixed(2) + 's">' + (l || '&nbsp;') + '</div>'; }).join('') + '';
  curtain.classList.add('show');
  curtain.addEventListener('click', dismissCurtain);
  document.addEventListener('keydown', function onk(e) { if (curtainDone) { document.removeEventListener('keydown', onk); return; } e.preventDefault(); dismissCurtain(); });
}

var leaving = false;
function leave(href) {
  if (leaving) return; leaving = true;
  Snd.play('close');
  var url = href + (href.indexOf('?') > -1 ? '&' : '?') + 'from=circuit-city&c=' + pcol.join(',');
  if (reduce) { location.href = url; return; }
  var g = irisGeometry();
  root.style.background = 'rgb(' + pcol.join(',') + ')';
  root.classList.add('iris-on'); setIris(g, g.R);
  run(850, function (t) { setIris(g, g.R * (1 - t)); }, function () { location.href = url; });
}
document.addEventListener('click', function (e) {
  var a = e.target.closest && e.target.closest('a[href="hub-homepage.html"]');
  if (!a || e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button > 0) return;
  e.preventDefault(); leave('hub-homepage.html');
});
window.addEventListener('pageshow', function (e) { if (e.persisted) { leaving = false; clearIris(); } });

/* ---------------- start ---------------- */
$('#hint').textContent = isTouch ? 'Drag to move. Two fingers: pinch to zoom, twist to rotate, slide to tilt. Tap any part.' : 'Drag to move. Right-drag to rotate and tilt. Scroll to zoom. Click any part.';
hasGL = initRenderer();
if (hasGL) {
  try { buildScene(); } catch (err) { hasGL = false; if (window.console) console.error(err); }
}
resize();
window.addEventListener('resize', resize);
if (hasGL) {
  camS.dist = W < 720 ? 30 : 34;
  clampCam(); applyCam();
} else {
  var fb = $('#fallback');
  fb.textContent = window.THREE ? 'Your browser could not start 3D graphics, so the board is not shown. The parts list below still opens every project.' : '3D could not load, so the board is not shown. The parts list below still opens every project.';
  fb.classList.add('show'); glc.style.display = 'none'; mini.style.display = 'none';
  setTimeout(openParts, 400);
}
rafId = requestAnimationFrame(frame);
if (fromPortal && !reduce) {
  var g0 = irisGeometry(); root.classList.add('iris-on'); setIris(g0, 0);
  run(950, function (t) { setIris(g0, g0.R * t); }, function () { clearIris(); playCurtain(); });
} else if (fromPortal) { clearIris(); playCurtain(); }
else if (!reduce) { playCurtain(); }
</script>
</body>
</html>
